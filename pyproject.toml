[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cobre-bridge"
version = "0.7.0"
description = "Anything-to-Cobre converter"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "inewave>=1.13.2",
    "pyarrow>=23.0.1",
    "pandas>=3.0.2",
    "plotly>=6.7.0",
    "polars>=1.39.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "ty>=0.0.32",
    "pytest-cov",
    "ruff",
]
validation = [
    # >=0.7.0: anticipated-thermal pre-horizon seeding (non-zero
    # past_anticipated_commitments.values_mw honoured by the LP fishing equality).
    "cobre-python>=0.7.0",
]

[project.scripts]
cobre-bridge = "cobre_bridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cobre_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
