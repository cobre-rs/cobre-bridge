[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cobre-bridge"
version = "0.12.0"
description = "Anything-to-Cobre converter"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "idecomp>=1.14.2",
    "inewave>=1.15.0",
    "pyarrow>=24.0.0",
    "pandas>=3.0.3",
    "plotly>=6.8.0",
    "polars>=1.42.0",
    "rich>=15.0.0",
    "typer>=0.26.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ty>=0.0.55",
    "pytest-cov",
    "ruff",
    "jsonschema",
]
# NOTE: the bridge now targets three cobre input-contract changes that all ride
# cobre's unreleased `feat/generic-constraint-authoring` branch (the next tagged
# release, expected 0.14): (1) F3 sense-free generic constraints
# (generic_constraints.json + generic_constraint_bounds.parquet: no `sense` key,
# bound_lower/bound_upper in place of a single `bound` column); (2) the
# scalar-parameters input moved from system/scalar_parameters.json to
# constraints/generic_parameters.json (clean break, JSON shape unchanged); and
# (3) the NCS availability column renamed `value` -> `availability_factor`.
# None is a tagged release yet, so there is no released version to pin to;
# bumping this constraint now would make `pip install -e ".[dev]"` unresolvable
# against the only cobre-python build that exists (an editable 0.13.0 checkout of
# that branch). Once cobre tags the release, hard-bump both extras below to it
# (and MIN_COBRE_VERSION in src/cobre_bridge/cli.py in lockstep) — do not guess
# a version number in the interim.
validation = [
    "cobre-python>=0.13,<0.14",
]
test-roundtrip = [
    "cobre-python>=0.13,<0.14",
]

[project.scripts]
cobre-bridge = "cobre_bridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cobre_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.pyright]
# Pyright is an editor aid only — CI gates ruff (see ruff.toml) and the project's
# declared type checker is `ty` (a dev dependency). Point Pyright at the project
# virtualenv so it resolves the typed first-party deps (idecomp/inewave both ship
# py.typed); without this, every `import idecomp...` raises a phantom
# reportMissingImports that buries genuine diagnostics.
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
# `typeCheckingMode = "off"` disables type-inference rules while KEEPING the
# high-value semantic checks — unresolved imports, undefined/unbound names,
# syntax errors — so a real broken import or typo still surfaces. Full type
# inference over pandas 3.x's `Series | DataFrame` unions produces ~1000
# false positives in this data-pipeline code (deep `.loc`/attribute/index
# access on the sanctioned bare-accessor idiom); ruff + `ty` are the real gates.
typeCheckingMode = "off"
# Keep unresolved-import reporting active even in "off" mode — that is exactly
# the class of diagnostic we DO want (a genuinely missing/typo'd import), now
# that the venv resolves the real deps.
reportMissingImports = "error"
reportMissingModuleSource = "none"
# Function-local type aliases (`BaseRow = dict[str, float]` used in a later
# annotation) are valid Python and work at runtime, but Pyright flags them under
# PEP 613 ("Variable not allowed in type expression"). Benign pedantry — silence
# it so the board stays 0/0 and any diagnostic that does appear is real signal.
reportInvalidTypeForm = "none"
