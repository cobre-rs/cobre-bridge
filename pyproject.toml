[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cobre-bridge"
version = "0.9.0"
description = "Anything-to-Cobre converter"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "inewave>=1.14.0",
    "pyarrow>=24.0.0",
    "pandas>=3.0.3",
    "plotly>=6.8.0",
    "polars>=1.42.0",
    "rich>=15.0.0",
    "typer>=0.26.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ty>=0.0.55",
    "pytest-cov",
    "ruff",
]
validation = [
    "cobre-python>=0.9.0,<0.10",
]

[project.scripts]
cobre-bridge = "cobre_bridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cobre_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
