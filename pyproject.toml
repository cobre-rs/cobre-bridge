[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cobre-bridge"
version = "0.8.0"
description = "Anything-to-Cobre converter"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "inewave>=1.13.2",
    "pyarrow>=24.0.0",
    "pandas>=3.0.3",
    "plotly>=6.7.0",
    "polars>=1.41.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "ty>=0.0.32",
    "pytest-cov",
    "ruff",
]
validation = [
    # >=0.8.0: tracks the cobre v0.8 schema line read by `convert --validate`.
    # (>=0.7.0 first honoured non-zero anticipated-thermal pre-horizon seeds via
    # past_anticipated_commitments.values_mw in the LP fishing equality.)
    "cobre-python>=0.8.0",
]

[project.scripts]
cobre-bridge = "cobre_bridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cobre_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
