[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cobre-bridge"
version = "0.14.3"
description = "Anything-to-Cobre converter"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "idecomp>=1.14.2",
    # 1.15.1 (not 1.15.0) is the first release to correctly decode the hybrid
    # production cortes (`Cortes.from_cortesh(por_estagio=True)`); 1.15.0 mis-decodes.
    "inewave>=1.15.1",
    "pyarrow>=24.0.0",
    "pandas>=3.0.3",
    "plotly>=6.8.0",
    "polars>=1.42.0",
    "rich>=15.0.0",
    "typer>=0.26.8",
    # REQUIRED runtime dep, not an optional extra: `convert decomp` imports the
    # boundary FCF by default and `convert --validate` / `compare` load cobre
    # output, so `import cobre` must work out of the box. Keep the floor in
    # lockstep with MIN_COBRE_VERSION in cli.py (which documents the contract).
    "cobre-python>=0.14.3,<0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ty>=0.0.55",
    "pytest-cov",
    "ruff",
    "jsonschema",
]

[project.scripts]
cobre-bridge = "cobre_bridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cobre_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = [
    "cobre_bridge.comparators.newave_readers",
    "cobre_bridge.comparators.alignment",
    "cobre_bridge.comparators.constraints_compare",
]

[tool.coverage.report]
fail_under = 83
# Ratchet: raise as coverage improves, never lower to dodge a regression — this is the combined aggregate over the 3 `source` modules above, not a per-module threshold.

[tool.pyright]
# Editor aid only — CI gates ruff (ruff.toml, whole tree) and the drift
# checks that follow it in the lint job.
# `ty` and pyright are local/editor aids only; neither is a CI step. Point
# at the venv so the typed first-party deps (idecomp/inewave ship
# py.typed) resolve instead of raising phantom missing-import errors.
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
# Type inference is off (pandas 3.x `Series | DataFrame` unions yield ~1000 false
# positives on the bare-accessor idiom) but the high-value semantic checks stay:
# missing imports are still errors; module-source and PEP 613 function-local type
# aliases are silenced as benign so any remaining diagnostic is real signal.
typeCheckingMode = "off"
reportMissingImports = "error"
reportMissingModuleSource = "none"
reportInvalidTypeForm = "none"
